routing_law:
  codex: mechanical + scaffold + typed-contract tickets; default worker
  grok: parallel second lane for disjoint mechanical tickets; if a grok job dies
    silently, reroute to codex and note it here (Gizmo lesson: 2/4 silent-death
    rate on scene-authoring tickets, 2026-07-06)
  sonnet-agent: tickets needing per-unit judgment (wireframe UX, audit finders,
    research); never fable subagents (model-tiering law)
